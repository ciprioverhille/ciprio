<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ciprio · Espace coach</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<!-- Espace coach : tout est dessiné par /assets/app/espace.js (une page, navigation par #/…). -->
<header class="co-top">

    <a class="co-brand" href="/"><img src="/logo.svg" alt=""><span>Ciprio</span><small>Coach</small></a>
    <div class="co-mid"><span class="crumb" id="crumb"></span><a class="co-prog idle" id="prog" href="#/videos" hidden></a></div>

      <span class="co-lang" role="group" aria-label="Langue"><button data-lang="en">ENG</button>·<button data-lang="fr">FR</button></span>
      <a class="avatar" id="avatar" href="#/parametres" hidden></a>
    </div>
  </div>
</header>

<div class="co-shell out" id="shell">
  <nav class="co-side" id="side" aria-label="Menu" hidden></nav>
  <main class="co" id="view" aria-live="polite"></main>
</div>

<dialog class="dlg" id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
